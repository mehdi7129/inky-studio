name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "scripts/build-mbedtls-apple.sh", "scripts/test-bluetooth-channel.sh", "scripts/test-https-wire.sh", "scripts/https-wire-bench/**", "server/inky_web/provisioning/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "scripts/build-mbedtls-apple.sh", "scripts/test-bluetooth-channel.sh", "scripts/test-https-wire.sh", "scripts/https-wire-bench/**", "server/inky_web/provisioning/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: iPhone build and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare synthetic TLS fixtures
        run: |
          python3 -m pip install 'cryptography>=44,<51'
          echo "INKY_TLS_TEST_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          echo "INKY_TLS_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          echo "INKY_HTTPS_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          INKY_TLS_TEST_PYTHON="$(command -v python3)" bash ios/Packages/InkyTLS/Tests/InkyTLSTests/Support/generate-fixtures.sh
      - name: Build pinned TLS dependency
        run: scripts/build-mbedtls-apple.sh
      - name: Test TLS bridge
        run: swift test --package-path ios/Packages/InkyTLS
      - name: Test Bluetooth channel against Python GATT transport
        run: scripts/test-bluetooth-channel.sh
      - name: Test adopted HTTPS identity over real loopback sockets
        run: scripts/test-https-wire.sh
      - name: Start isolated frame fixture
        run: |
          python3 ios/scripts/mock-server.py > /tmp/inky-fixture.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/api/health; then break; fi
            sleep 1
          done
          python3 ios/scripts/smoke-api.py
      - name: Prepare simulator photo library
        timeout-minutes: 8
        run: |
          DEVICE_ID=$(xcrun simctl create 'Inky CI' com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "INKY_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          python3 ios/scripts/seed-simulator-photo.py "$DEVICE_ID"
      - name: Build and test
        run: |
          xcodebuild -project ios/InkyStudio.xcodeproj -scheme InkyStudio \
            -destination "platform=iOS Simulator,id=$INKY_SIMULATOR_ID" \
            -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - name: Build iPhone release
        run: |
          xcodebuild -project ios/InkyStudio.xcodeproj -scheme InkyStudio \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
          retention-days: 14
