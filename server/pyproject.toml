[project]
name = "inky-studio-server"
version = "0.5.0rc2"
description = "FastAPI backend for Inky Studio — web UI for Inky e-ink photo frame"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Inky Studio contributors" }]

dependencies = [
    "anyio>=4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "websockets>=13.1",
    "cryptography>=44,<51",
    "dbus-fast>=5.0.22,<6",
    "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
pi = [
    # Preserve the deployed version until a coordinated hardware qualification.
    # AC073 source is identical in 2.3/2.4; the historical GPIO failure's cause
    # remains unresolved. The AC073 busy observer also targets this exact pin.
    "inky==2.3.0",
    "gpiod>=2.2",
    "RPi.GPIO>=0.7",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
inky-studio-server = "inky_web.main:run"

[build-system]
# Hatchling's editable hook requires editables too. Declare it explicitly so
# an offline build environment can be closed without executing a build hook.
requires = ["hatchling", "editables>=0.3,<1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inky_web"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on calls like Query()/Depends()/File() in argument defaults.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
