name: InkyStudio
options:
  bundleIdPrefix: fr.mehdiguiard
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: X524H8XA4L
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  InkyTLS:
    path: Packages/InkyTLS
targets:
  InkyStudio:
    type: application
    platform: iOS
    sources:
      - InkyStudio
    dependencies:
      - package: InkyTLS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.mehdiguiard.inkystudio
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: InkyStudio/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  InkyStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InkyStudioTests]
    dependencies:
      - target: InkyStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  InkyStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [InkyStudioUITests]
    dependencies:
      - target: InkyStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InkyStudio:
    build:
      targets:
        InkyStudio: all
    test:
      gatherCoverageData: true
      targets:
        - InkyStudioTests
        - InkyStudioUITests
    archive:
      config: Release
